name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w @kelid/web
      - run: npx playwright install chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  # سرور روی PostgreSQL واقعی؛ کانتینر سرویس فقط روی لینوکس هست.
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      KELID_TEST_DATABASE_URL: postgres://kelid_app:kelid_app@localhost:5432/kelid_test
      KELID_TEST_MIGRATION_DATABASE_URL: postgres://kelid_owner:kelid_owner@localhost:5432/kelid_test
      KELID_REQUIRE_TEST_DB: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: psql postgres://postgres:postgres@localhost:5432/postgres -v ON_ERROR_STOP=1 -q -f apps/server/db/init.sql
      - run: npm ci
      - run: npx vitest run apps/server
      - run: npm run build -w @kelid/server
